<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectra — Контакти</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a class="logo" href="../index.html">vectra</a>
            <nav class="nav" aria-label="Головне меню">
                <ul class="nav__list">
                    <li><a class="nav__link" href="../index.html">Головна</a></li>
                    <li><a class="nav__link" href="services.html">Послуги</a></li>
                    <li><a class="nav__link" href="cabinet.html">Кабінет</a></li>
                    <li><a class="nav__link nav__link--active" href="contact.html">Контакти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="section contact-section">
            <h1 class="page-title">Зв'яжіться з нами</h1>
            <p>Розкажіть про вашу задачу — ми запропонуємо технологічне рішення.</p>
            
            <div class="contact-grid">
                <div class="contact-info">
                    <h3>Контактна інформація</h3>
                    <p>📍 Київ, Україна • Працюємо глобально</p>
                    <p>✉️ hello@vectra.ua</p>
                </div>
                <form class="contact-form">
                    <label>Ваше ім'я: <input type="text" required class="search-input"></label>
                    <label>Email або Телефон: <input type="text" required class="search-input"></label>
                    <label>Повідомлення: <textarea rows="4" required class="search-input"></textarea></label>
                    <button type="submit" class="btn">Надіслати заявку</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <p>&copy; 2026 Vectra</p>
        </div>
    </footer>
</body>
</html>
